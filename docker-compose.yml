services:

  postgres:
    image: postgres:16
    container_name: authservice-postgres
    environment:
      POSTGRES_DB: authServicedb
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: Dheeraj@2026
    ports:
      - "5432:5432"

  authservice:
    build: .
    container_name: authservice-container
    ports:
      - "8080:8080"
    depends_on:
      - postgres